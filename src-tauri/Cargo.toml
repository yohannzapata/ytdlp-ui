[package]
name = "ytdlp-ui"
version = "0.2.0"
description = "A simple, modern desktop app for yt-dlp"
authors = ["Yohann Joachim Zapata"]
license = "MIT"
repository = "https://github.com/yohannzapata/ytdlp-ui"
homepage = "https://github.com/yohannzapata/ytdlp-ui"
readme = "../README.md"
keywords = ["yt-dlp", "youtube", "downloader", "tauri", "gui"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ytdlp_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", features = ["stream"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
shell-words = "1.1.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
